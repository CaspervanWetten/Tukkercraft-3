volumes:
  RPG-Minecraft-Volume:
    external: true

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped

    ports:
      - "42065:25565"

    environment:
      EULA: "TRUE"
      VERSION: "1.21.1"
      TYPE: "NEOFORGE"
      MEMORY: "6G"
      DIFFICULTY: "hard"
      MODE: "survival"
      MOTD: "Tukkercraft 3! Want het kan altijd meer ;)"
      ENABLE_RCON: "false"
      JVM_XX_OPTS: "-Xms6G -Xmx6G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1"

    volumes:
      - RPG-Minecraft-Volume:/data
      - ./mods:/data/mods
      - ./config:/data/config



